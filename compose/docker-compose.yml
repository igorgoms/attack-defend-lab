services:
  juice-shop:
    image: bkimminich/juice-shop:v20.3.0
    restart: unless-stopped
    networks: [lab]

  nginx:
    image: nginx:stable-alpine3.24-slim
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [juice-shop]
    networks: [lab]


networks:
  lab:
